name: KnownFaces CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install isolated check tools
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/kf-venv"
          "$RUNNER_TEMP/kf-venv/bin/pip" install -r requirements.txt pytest==9.2.0
          echo "$RUNNER_TEMP/kf-venv/bin" >> "$GITHUB_PATH"
          npm install --prefix "$RUNNER_TEMP/kf-npm" @fission-ai/openspec@2.1.1
          echo "$RUNNER_TEMP/kf-npm/node_modules/.bin" >> "$GITHUB_PATH"
          bash scripts/install-bicep.sh
      - run: python -m scripts.ci
